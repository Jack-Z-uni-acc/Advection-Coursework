[project]
name = "advection-coursework"
version = "0.1.0"
description = "Numerical schemes for the 1d advection equation"
readme = "README.md"
authors = [
    { name = "Jack Zanker", email = "zankerjack1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
advection-coursework = "advection_coursework:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
